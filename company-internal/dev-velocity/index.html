<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 1200px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
h1 { font-size: 22px; margin-bottom: 4px; }
h2 { font-size: 16px; margin-top: 32px; margin-bottom: 10px; }
.sub { color: #666; margin-bottom: 20px; font-size: 14px; }
.chart-wrap { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { background: #f6f6f6; border-radius: 8px; padding: 12px 16px; }
.stat-label { font-size: 12px; color: #666; text-transform: uppercase; }
.stat-value { font-size: 20px; font-weight: 600; margin-top: 2px; }
.stat-sub { font-size: 11px; color: #888; margin-top: 2px; }
table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #fafafa; font-weight: 600; font-size: 11px; color: #555; text-transform: uppercase; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.medal { width: 28px; font-size: 18px; text-align: center; padding: 8px 4px; }
.toggle { display: inline-flex; gap: 0; margin-bottom: 12px; border: 1px solid #d0d0d0; border-radius: 6px; overflow: hidden; }
.tog-btn { background: #fff; border: none; padding: 6px 14px; font-size: 13px; cursor: pointer; color: #444; }
.tog-btn.active { background: #4f46e5; color: #fff; }
.tog-btn + .tog-btn { border-left: 1px solid #d0d0d0; }
</style></head>
<body>

<div class="sub">YouSquared-ios (192) + clone-backend (1263) — 2024-09-16 to 2026-04-20</div>

<div class="chart-wrap"><canvas id="total" height="100"></canvas></div>

<div class="chart-wrap"><canvas id="mtime" height="100"></canvas></div>
