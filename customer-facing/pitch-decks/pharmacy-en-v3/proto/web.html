<!DOCTYPE html>
<html lang="en">
<head>
<!-- embed mode: no gate, no feedback, auto-scaled web desktop view -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouSquared — Web Desktop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:transparent;overflow:hidden;margin:0;padding:0}
#root{width:1200px;height:720px;transform-origin:top left}

:root{
  --accent:#FF8370;--accent-dark:#E07A5F;--accent-surface:#FF8370;
  --primary-text:#2D2A26;--secondary-text:#6B6560;--tertiary-text:#9E9893;
  --bg:#FFFFFF;--bg-primary:#FAF8F6;
  --surface-dark:#F8F6F4;--surface-darken:#F0EDEA;--surface-black:#2D2A26;
  --border:#E8E4E0;--input-bg:#F5F2EF;--input-stroke:#D8D4D0;
  --error:#E53935;--green:#43A047;--gold:#FFB300;--blue:#1E88E5;
  --accent-12:rgba(255,131,112,0.12);
  --on-label:#FFFFFF;
  --xs:4px;--sm:10px;--normal:16px;--md:20px;--lg:30px;--xl:40px;
  --r-sm:8px;--r:10px;--r-lg:12px;--r-xl:18px;--r-xxl:30px;
  --cell-h:56px;--btn-h:48px;
}

/* Avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex-shrink:0;letter-spacing:-.5px}
/* Tag */
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}

/* ── Web layout ── */
.web-frame{width:1200px;max-width:calc(100vw - 40px);height:720px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);display:flex}
.web-sidebar{width:256px;display:flex;flex-direction:column;border-right:1px solid #e5e5e5;background:#fafafa;flex-shrink:0}
.web-sidebar::-webkit-scrollbar{display:none}
.web-sidebar-brand{display:flex;align-items:center;gap:12px;padding:16px}
.web-sidebar-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FF8370,#e06a58);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.web-sidebar-brand-text{font-size:18px;font-weight:500;color:#171717}
.web-sidebar-switcher{display:flex;align-items:center;gap:8px;padding:4px 12px 12px;cursor:pointer}
.web-sidebar-switcher:hover{opacity:.8}
.web-switcher-avatar{width:28px;height:28px;border-radius:14px;background:#e5e5e5;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#737373;flex-shrink:0}
.web-switcher-name{font-size:14px;font-weight:500;color:#171717;flex:1}
.web-sidebar-nav{flex:1;overflow-y:auto;padding:0 8px}
.web-sidebar-nav::-webkit-scrollbar{display:none}
.web-nav-item{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:14px;color:#737373;transition:all .15s;position:relative}
.web-nav-item:hover{background:#f0f0f0;color:#171717}
.web-nav-item.active{background:#f0f0f0;font-weight:500;color:#171717}
.web-nav-badge{font-size:10px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;background:#FF8370;color:#fff;border-radius:9px;padding:0 5px;margin-left:auto}
.web-nav-badge.muted{background:transparent;color:#737373;font-weight:500;font-size:12px}
.web-nav-section{padding:14px 12px 6px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:#a3a3a3}
.web-nav-more{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;color:#a3a3a3;cursor:pointer}
.web-nav-more:hover{color:#171717}
.web-sidebar-promo{margin:0 8px 12px;padding:12px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;font-size:12px;color:#737373;line-height:1.4}
.web-sidebar-promo a{display:inline-block;margin-top:6px;font-size:12px;font-weight:500;color:#FF8370;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.web-sidebar-footer{border-top:1px solid #e5e5e5;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.web-sidebar-footer span{font-size:14px;font-weight:500;color:#737373}
.web-sidebar-footer button{background:none;border:none;font-size:14px;color:#a3a3a3;cursor:pointer;font-family:inherit}
.web-sidebar-footer button:hover{color:#171717}
.web-main{display:flex;flex:1;overflow:hidden}
.web-list-col{width:384px;display:flex;flex-direction:column;flex-shrink:0}
.web-list-header{padding:12px 16px;border-bottom:1px solid #e5e5e5}
.web-search-input{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#f5f5f5;border-radius:8px;border:1px solid #e5e5e5}
.web-search-input input{border:none;background:transparent;outline:none;font-size:14px;font-family:inherit;color:#171717;flex:1}
.web-search-input input::placeholder{color:#a3a3a3}
.web-inbox-list{flex:1;overflow-y:auto}
.web-inbox-list::-webkit-scrollbar{display:none}
.web-detail-col{flex:1;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid #e5e5e5}
.web-detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:#a3a3a3}
.web-detail-empty svg{opacity:.5}
.web-detail-empty p{font-size:14px}
.web-inbox-item{display:flex;width:100%;align-items:flex-start;gap:12px;padding:12px 16px;cursor:pointer;background:#fff;text-align:left;border:none;border-bottom:1px solid #f0f0f0;font-family:inherit;transition:background .1s}
.web-inbox-item:hover{background:#fafafa}
.web-inbox-item.selected{background:#f5f5f5}

/* ── Filter sidebar ── */
.filter-row{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .15s}
.filter-row:hover{background:var(--surface-dark)}
.filter-row-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.filter-row-check.checked{background:var(--accent);border-color:var(--accent)}
.filter-row-expand{color:var(--tertiary-text);transition:transform .2s;display:flex;padding:10px;margin:-6px;cursor:pointer}
.filter-row-expand.open{transform:rotate(180deg)}
.subtag-chip{font-size:11px;padding:3px 9px;border-radius:10px;cursor:pointer;transition:all .15s;font-weight:500;border:1px solid var(--border);background:var(--bg);color:var(--secondary-text)}
.subtag-chip:hover{border-color:var(--accent)}
.subtag-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.web-sidebar .filter-row{padding:5px 12px;gap:8}
.web-sidebar .filter-row-check{width:16px;height:16px;border-radius:4px}
.web-sidebar .subtag-chip{font-size:10px;padding:2px 7px}

/* Primary button */
.btn-primary{padding:0 20px;height:var(--btn-h);border-radius:var(--r-xxl);background:var(--accent);color:#fff;border:none;font-weight:600;cursor:pointer;font-family:inherit;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}

/* Industry switcher */
.industry-select{display:block;width:calc(100% - 24px);margin:0 12px 8px;padding:6px 10px;font-size:12px;font-weight:500;font-family:inherit;border:1px solid #e5e5e5;border-radius:8px;background:#fff;color:#171717;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23737373' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center}
.industry-select:focus{outline:none;border-color:#FF8370}
</style>
</head>
<body>
<div id="root"></div>

// ── Helpers ──
const avatarColors=['#E07A5F','#3D5A80','#81B29A','#F2CC8F','#6D597A','#B56576','#355070','#E56B6F'];
const avatarColor=n=>{let h=0;for(let c of n)h=c.charCodeAt(0)+((h<<5)-h);return avatarColors[Math.abs(h)%avatarColors.length]};
const initials=(fn,ln)=>`${(fn||'')[0]||''}${(ln||'')[0]||''}`.toUpperCase();
const tagColor=t=>{let h=0;for(let c of t)h=c.charCodeAt(0)+((h<<5)-h);return avatarColors[Math.abs(h)%avatarColors.length]};

function Avatar({name,size=40}){
  const p=name.split(' ');
  return <div className="avatar" style={{width:size,height:size,fontSize:size*.38,background:avatarColor(name)}}>{initials(p[0],p[1])}</div>;
}
function Tag({text,color:c}){
  const col=c||tagColor(text);
  return <span className="tag" style={{color:col,background:`${col}11`,border:`1px solid ${col}30`}}>{text}</span>;
}
function TagDot({color,size=10}){
  return <span style={{display:'inline-block',width:size,height:size,borderRadius:size/2,background:color,flexShrink:0}}/>;

function TagPalette({value,onChange}){
  return(
    <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
      {TAG_PALETTE.map(c=>(
        <button key={c} type="button" onClick={()=>onChange(c)}
          style={{width:20,height:20,borderRadius:10,background:c,border:'none',cursor:'pointer',padding:0,
            boxShadow:value===c?`0 0 0 2px #fff, 0 0 0 4px ${c}`:'none'}}/>
      ))}
    </div>
  );
}

function TagManagementModal({tags,setTags,onClose}){
  const[editingId,setEditingId]=useState(null);
  const[draftName,setDraftName]=useState('');
  const[draftColor,setDraftColor]=useState(TAG_PALETTE[5]);
  const[creating,setCreating]=useState(false);
  const[newName,setNewName]=useState('');
  const[newColor,setNewColor]=useState(TAG_PALETTE[5]);
  const startEdit=t=>{setCreating(false);setEditingId(t.id);setDraftName(t.label);setDraftColor(t.color||TAG_PALETTE[5])};
  const cancelEdit=()=>{setEditingId(null);setDraftName('')};
  const saveEdit=t=>{const n=draftName.trim();if(!n)return;setTags(prev=>prev.map(x=>x.id===t.id?{...x,label:n,color:draftColor}:x));setEditingId(null)};
  const remove=t=>setTags(prev=>prev.filter(x=>x.id!==t.id));
  const startCreate=()=>{setEditingId(null);setCreating(true);setNewName('');setNewColor(TAG_PALETTE[5])};
  const saveCreate=()=>{const n=newName.trim();if(!n){setCreating(false);return}setTags(prev=>[...prev,{id:`custom_${Date.now()}`,label:n,color:newColor}]);setCreating(false);setNewName('')};
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100}} onClick={onClose}>
      <div style={{background:'#fff',borderRadius:12,width:480,maxWidth:'92vw',maxHeight:'85vh',display:'flex',flexDirection:'column',boxShadow:'0 20px 50px rgba(0,0,0,.25)'}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:'18px 22px 6px'}}><div style={{fontSize:18,fontWeight:600,color:'#171717'}}>Manage Tags</div><div style={{fontSize:13,color:'#737373',marginTop:4}}>Create, rename, recolor or delete your contact tags.</div></div>
        <div style={{padding:'12px 12px',flex:1,overflowY:'auto'}}>
          {tags.map(t=>{
            const isEditing=editingId===t.id;
            if(isEditing) return(
              <div key={t.id} style={{padding:'10px 10px',borderRadius:8,background:'#fafafa',marginBottom:6,display:'flex',flexDirection:'column',gap:8}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <TagDot color={draftColor} size={12}/>
                  <input value={draftName} onChange={e=>setDraftName(e.target.value)} autoFocus style={{flex:1,padding:'5px 8px',fontSize:13,border:'1px solid #d4d4d4',borderRadius:6,outline:'none',fontFamily:'inherit'}}/>
                  <button onClick={()=>saveEdit(t)} style={{background:'none',border:'none',padding:4,cursor:'pointer',display:'flex',color:'#22c55e'}}>{I.checkmark({s:14,c:'#22c55e'})}</button>
                  <button onClick={cancelEdit} style={{background:'none',border:'none',padding:4,cursor:'pointer',display:'flex'}}>{I.x({s:14,c:'#737373'})}</button>
                </div>
                <TagPalette value={draftColor} onChange={setDraftColor}/>
              </div>
            );
            return(
              <div key={t.id} style={{padding:'8px 12px',display:'flex',alignItems:'center',gap:10,borderRadius:6}}>
                <TagDot color={t.color||TAG_PALETTE[5]} size={10}/>
                <span style={{flex:1,fontSize:13,color:'#171717'}}>{t.label}</span>
                {t.count>0&&<span style={{fontSize:11,color:'#a3a3a3'}}>{t.count}</span>}
                <button onClick={()=>startEdit(t)} style={{background:'none',border:'none',padding:4,cursor:'pointer',display:'flex',borderRadius:4}}>{I.edit({s:13,c:'#737373'})}</button>
                <button onClick={()=>remove(t)} style={{background:'none',border:'none',padding:4,cursor:'pointer',display:'flex',borderRadius:4}}>{I.trash({s:13,c:'#737373'})}</button>
              </div>
            );
          })}
          {creating&&(
            <div style={{padding:'10px 10px',borderRadius:8,background:'#fafafa',marginTop:6,display:'flex',flexDirection:'column',gap:8}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <TagDot color={newColor} size={12}/>
                <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Tag name" autoFocus onKeyDown={e=>{if(e.key==='Enter')saveCreate();if(e.key==='Escape')setCreating(false)}} style={{flex:1,padding:'5px 8px',fontSize:13,border:'1px solid #d4d4d4',borderRadius:6,outline:'none',fontFamily:'inherit'}}/>
                <button onClick={saveCreate} style={{background:'none',border:'none',padding:4,cursor:'pointer',display:'flex'}}>{I.checkmark({s:14,c:'#22c55e'})}</button>
                <button onClick={()=>setCreating(false)} style={{background:'none',border:'none',padding:4,cursor:'pointer',display:'flex'}}>{I.x({s:14,c:'#737373'})}</button>
              </div>
              <TagPalette value={newColor} onChange={setNewColor}/>
            </div>
          )}
          {!creating&&(
            <button onClick={startCreate} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 12px',marginTop:4,width:'100%',background:'none',border:'1px dashed #d4d4d4',borderRadius:6,cursor:'pointer',fontFamily:'inherit',fontSize:13,color:'#FF8370',fontWeight:500}}>
              {I.plus({s:14,c:'#FF8370'})}<span>Add Tag</span>
            </button>
          )}
        </div>
        <div style={{padding:'12px 22px',borderTop:'1px solid #e5e5e5',display:'flex',justifyContent:'flex-end'}}>
          <button onClick={onClose} style={{padding:'8px 18px',background:'#171717',color:'#fff',border:'none',borderRadius:8,cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:500}}>Done</button>
        </div>
      </div>
    </div>
  );
}

  // Select data based on industry
  const isOncology=industry==='oncology';
  const currentTodos=isOncology?ONCOLOGY_TODOS:PHARMACY_TODOS;
  const currentFilterLabels=isOncology?ONCOLOGY_FILTER_LABELS:PHARMACY_FILTER_LABELS;
  const currentFilterCounts=isOncology?ONCOLOGY_FILTER_COUNTS:PHARMACY_FILTER_COUNTS;
  const currentSubtags=isOncology?ONCOLOGY_SUBTAGS:PHARMACY_SUBTAGS;
  const currentSubtagCounts=isOncology?ONCOLOGY_SUBTAG_COUNTS:PHARMACY_SUBTAG_COUNTS;
  const currentMockContacts=isOncology?ONCOLOGY_MOCK_CONTACTS:PHARMACY_MOCK_CONTACTS;
  const currentMissedCalls=isOncology?ONCOLOGY_MISSED_CALLS:PHARMACY_MISSED_CALLS;

  const industryTodos=currentTodos.slice().sort((a,b)=>{
    const ai=SCENARIO_TYPE_ORDER.indexOf(a.type||'other');
    const bi=SCENARIO_TYPE_ORDER.indexOf(b.type||'other');
    return (ai<0?999:ai)-(bi<0?999:bi);
  });
  const labels=tags;
  const counts=currentFilterCounts;
  const stCounts=currentSubtagCounts;
  const contacts=currentMockContacts;
  const pending=industryTodos.filter(t=>!sentIds.includes(t.id));
  const visibleContacts=contacts.filter(c=>!removedContacts.includes(c.name)&&(activeSubtags.length===0||activeSubtags.includes(c.subtag)));
  const toggleLabel=id=>setActiveLabels(p=>p.includes(id)?p.filter(l=>l!==id):[...p,id]);
  const toggleSubtag=st=>setActiveSubtags(p=>p.includes(st)?p.filter(s=>s!==st):[...p,st]);

  // Compute list items based on filter
  const getListItems=()=>{
    switch(filter){
      case 'todo': return pending;
      case 'inbox': return industryTodos;
      case 'urgent': return industryTodos.filter(t=>t.due==='Today');
      case 'unread': return industryTodos.slice(0,4);
      case 'missed': return [];
      default: return pending;
    }
  };
  const listItems=getListItems();

  const tabs=[
    {k:'inbox',l:'Inbox',badge:industryTodos.length,icon:true},
    {k:'todo',l:'Suggested to-dos',badge:pending.length},
    {k:'urgent',l:'Urgent',badge:industryTodos.filter(t=>t.due==='Today').length},
    {k:'unread',l:'Unread',badge:4},
    {k:'missed',l:'Missed',badge:currentMissedCalls.length,muted:true}
  ];

  // Handle nav clicks
  const handleNavClick=(key)=>{
    setSidePanel(null);
    setFilter(key);
    setOpenThread(null);
  };
  const handlePanelClick=(panel)=>{
    setFilter(null);
    setSidePanel(panel);
    setOpenThread(null);
  };

  // Render todo/inbox item
  const renderItem=(todo,isMissed=false)=>{
    const isUrgent=todo.due==='Today';
    const isSelected=openThread&&openThread.id===todo.id;
    const isSent=sentIds.includes(todo.id);
    return(
      <button type="button" key={todo.id} onClick={()=>{if(!isMissed)setOpenThread(todo)}} className={`web-inbox-item ${isSelected?'selected':''}`}>
        <div style={{width:36,height:36,borderRadius:18,background:isMissed?'#FEE2E2':'#f5f5f5',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2}}>
          {isMissed?I.missedCall({s:16,c:'#ef4444'}):I.outbound({s:16,c:'#737373'})}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span style={{fontSize:14,fontWeight:600,color:'#171717'}}>{todo.contact}</span>
            {isUrgent&&!isMissed&&<span style={{display:'flex'}}>{I.bell({s:12,c:'#ef4444'})}</span>}
            {isMissed?
              <span style={{fontSize:10,fontWeight:700,background:'#ef4444',color:'#fff',padding:'1px 6px',borderRadius:4,lineHeight:'16px'}}>Missed</span>
            :isSent?
              <span style={{fontSize:10,fontWeight:700,background:'#22c55e',color:'#fff',padding:'1px 6px',borderRadius:4,lineHeight:'16px'}}>Sent</span>
            :
              <span style={{fontSize:10,fontWeight:700,background:'#FF8370',color:'#fff',padding:'1px 6px',borderRadius:4,lineHeight:'16px'}}>To-Do</span>
            }
            <span style={{marginLeft:'auto',flexShrink:0,fontSize:12,color:isUrgent?'#171717':'#737373',fontWeight:isUrgent?600:400}}>{todo.due||todo.time}</span>
          </div>
          <p style={{fontSize:13,color:'#737373',lineHeight:1.4,overflow:'hidden',textOverflow:'ellipsis',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',marginTop:2,margin:0}}>{todo.summary}</p>
        </div>
      </button>
    );
  };

  return(
    <div className="web-frame">
      <aside className="web-sidebar">
        <div className="web-sidebar-brand">
          <div className="web-sidebar-logo">Y&#178;</div>
          <span className="web-sidebar-brand-text">YouSquared</span>
        </div>
        <div className="web-sidebar-switcher">
          <div className="web-switcher-avatar">A</div>
          <span className="web-switcher-name">Alex Dalyac</span>
          <span style={{display:'flex'}}>{I.chevronDown({s:12,c:'#a3a3a3'})}</span>
        </div>

        {/* Industry dropdown */}
        <select className="industry-select" value={industry} onChange={e=>{const v=e.target.value;setIndustry(v);setOpenThread(null);setSidePanel(null);setFilter('todo');setSentIds([]);setActiveLabels([]);setActiveSubtags([])}}>
          <option value="pharmacy">Pharmacy</option>
          <option value="oncology">Oncology</option>
          <option value="pharmacy">Primary Care</option>
          <option value="pharmacy">Dermatology</option>
          <option value="pharmacy">Gastroenterology</option>
          <option value="pharmacy">Orthopedics</option>
          <option value="pharmacy">Cardiology</option>
          <option value="pharmacy">OB/GYN</option>
          <option value="pharmacy">Urology</option>
          <option value="pharmacy">ENT</option>
          <option value="pharmacy">Mental Health</option>
          <option value="pharmacy">Pain Management</option>
          <option value="pharmacy">Dental</option>
          <option value="pharmacy">Ophthalmology</option>
          <option value="pharmacy">Podiatry</option>
        </select>

        <nav className="web-sidebar-nav">
          {tabs.map(tab=>(
            <div key={tab.k} className={`web-nav-item ${filter===tab.k&&!sidePanel?'active':''}`} onClick={()=>handleNavClick(tab.k)}>
              {tab.icon&&<span style={{display:'flex'}}>{I.inbox({s:16,c:filter===tab.k&&!sidePanel?'#171717':'#737373'})}</span>}
              <span>{tab.l}</span>
              {tab.badge>0&&<span className={`web-nav-badge ${tab.muted?'muted':''}`}>{tab.badge}</span>}
            </div>
          ))}
          <div className="web-nav-more">{I.chevronDown({s:12,c:'#a3a3a3'})} More</div>

          <div style={{padding:'14px 12px 6px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:11,fontWeight:500,textTransform:'uppercase',letterSpacing:'.8px',color:'#a3a3a3'}}>Contact Labels</span>
            <span onClick={onManageTags} style={{fontSize:11,color:'#FF8370',fontWeight:500,cursor:'pointer'}}>Manage</span>
          </div>
          {labels.map(label=>{
            const count=label.count!=null?label.count:(counts[label.id]||0);
            const isActive=activeLabels.includes(label.id);
            const isExpanded=expandedLabel===label.id;
            return(
              <React.Fragment key={label.id}>
                <div className="filter-row" style={{padding:'5px 12px',gap:8}} onClick={()=>toggleLabel(label.id)}>
                  <div className={`filter-row-check ${isActive?'checked':''}`} style={{width:16,height:16,borderRadius:4}}>
                    {isActive&&<span style={{color:'#fff',fontSize:9,fontWeight:700}}>&#10003;</span>}
                  </div>
                  <TagDot color={label.color||'#9ca3af'} size={8}/>
                  <span style={{flex:1,fontSize:13,color:isActive?'#171717':'#737373'}}>{label.label}</span>
                  <span style={{fontSize:11,color:'#a3a3a3'}}>{count}</span>
                  {label.hasSubtags&&currentSubtags.length>0&&(
                    <span onClick={e=>{e.stopPropagation();setExpandedLabel(isExpanded?null:label.id);setShowContacts(false)}} className={`filter-row-expand ${isExpanded?'open':''}`} style={{padding:6,margin:-4}}>
                      {I.chevronDown({s:10,c:'#a3a3a3'})}
                    </span>
                  )}
                </div>
                {label.hasSubtags&&isExpanded&&(
                  <div style={{paddingLeft:36}}>
                    <div style={{display:'flex',flexWrap:'wrap',gap:4,padding:'2px 8px 8px 0'}}>
                      {currentSubtags.map(st=>(
                        <span key={st} className={`subtag-chip ${activeSubtags.includes(st)?'active':''}`} onClick={()=>toggleSubtag(st)} style={{fontSize:10,padding:'2px 7px'}}>
                          {st} <span style={{opacity:.6}}>{stCounts[st]||0}</span>
                        </span>
                      ))}
                    </div>
                    {contacts.length>0&&(
                      <div style={{padding:'0 8px 4px 0'}}>
                        <div onClick={()=>setShowContacts(!showContacts)} style={{fontSize:10,color:'#FF8370',fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',gap:3}}>
                          {showContacts?'Hide':'Show'} contacts ({visibleContacts.length})
                          <span className={`filter-row-expand ${showContacts?'open':''}`} style={{padding:3,margin:-2}}>{I.chevronDown({s:8,c:'#FF8370'})}</span>
                        </div>
                      </div>
                    )}
                    {showContacts&&(
                      <div style={{paddingBottom:4}}>
                        {visibleContacts.map(c=>(
                          <div key={c.name} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 8px 3px 0',fontSize:12,color:'#737373'}}>
                            <Avatar name={c.name} size={18}/>
                            <span style={{flex:1}}>{c.name}</span>
                            {c.subtag&&<span style={{fontSize:8,color:'#a3a3a3',background:'#f0f0f0',padding:'1px 4px',borderRadius:4}}>{c.subtag}</span>}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </React.Fragment>
            );
          })}
          <div onClick={onManageTags} style={{padding:'6px 12px',display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
            {I.plus({s:14,c:'#FF8370'})}
            <span style={{fontSize:13,fontWeight:500,color:'#FF8370'}}>Add Label</span>
          </div>

          <div className="web-nav-section">AI Personalization</div>
          <div className={`web-nav-item ${sidePanel==='about'?'active':''}`} onClick={()=>handlePanelClick('about')}>
            <span style={{display:'flex'}}>{I.idCard({s:16,c:sidePanel==='about'?'#171717':'#737373'})}</span>
            <span>About You</span>
          </div>
          <div className={`web-nav-item ${sidePanel==='company'?'active':''}`} onClick={()=>handlePanelClick('company')}>
            <span style={{display:'flex'}}>{I.building({s:16,c:sidePanel==='company'?'#171717':'#737373'})}</span>
            <span>Company Info</span>
          </div>
          <div className={`web-nav-item ${sidePanel==='secretary'?'active':''}`} onClick={()=>handlePanelClick('secretary')}>
            <span style={{display:'flex'}}>{I.spark({s:16,c:sidePanel==='secretary'?'#171717':'#737373'})}</span>
            <span>Secretary Settings</span>
          </div>
        </nav>

        <div className="web-sidebar-promo">
          More features available in iOS!
          <a>Download the app</a>
        </div>
        <div className="web-sidebar-footer">
          <span>Alex</span>
          <button>Sign out</button>
        </div>
      </aside>

      <div className="web-main">
        {/* Side panels replace both columns */}
        {sidePanel==='about'?<AboutYouPanel/>:
         sidePanel==='company'?<CompanyInfoPanel/>:
         sidePanel==='secretary'?<SecretarySettingsPanel/>:
        <>
        <div className="web-list-col">
          <div className="web-list-header">
            <div className="web-search-input">
              <span style={{display:'flex'}}>{I.search({s:16,c:'#a3a3a3'})}</span>
              <input placeholder="Search Inbox..."/>
            </div>
          </div>
          <div className="web-inbox-list">
            {filter==='missed'?(
              currentMissedCalls.length>0?currentMissedCalls.map(mc=>renderItem(mc,true)):(
                <div style={{padding:'60px 24px',textAlign:'center',color:'#a3a3a3',fontSize:14}}>No missed calls.</div>
              )
            ):listItems.length>0?listItems.map(todo=>renderItem(todo)):(
              <div style={{padding:'60px 24px',textAlign:'center',color:'#a3a3a3',fontSize:14}}>
                {filter==='todo'?'All to-dos completed.':'No items to display.'}
              </div>
            )}
          </div>
        </div>

        <div className="web-detail-col">
          {openThread?(
            <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
              <div style={{display:'flex',alignItems:'center',padding:'12px 16px',gap:12,borderBottom:'1px solid #e5e5e5',flexShrink:0}}>
                <Avatar name={openThread.contact} size={36}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:16,fontWeight:600,color:'#171717'}}>{openThread.contact}</div>
                  <div style={{fontSize:12,color:'#737373'}}>{openThread.rel}</div>
                </div>
                <Tag text={openThread.rel}/>
                <button onClick={()=>setOpenThread(null)} style={{background:'none',border:'none',fontSize:20,color:'#a3a3a3',cursor:'pointer',padding:4}}>&times;</button>
              </div>
              <div style={{flex:1,overflowY:'auto',padding:'0 16px'}}>
                <div style={{textAlign:'center',padding:'12px 0 10px'}}>
                  <span style={{fontSize:11,fontWeight:500,color:'#a3a3a3',background:'#f5f5f5',padding:'3px 10px',borderRadius:10}}>Earlier</span>
                </div>
                {(openThread.earlierItems||[]).map((item,i)=>(
                  <div key={i} style={{marginBottom:10,...(item.direction==='out'?{marginLeft:24}:{marginRight:24})}}>
                    <div style={{padding:'10px 12px',background:'#f5f5f5',borderRadius:10,border:'1px solid #e5e5e5'}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:item.text?0:4}}>
                        <span style={{display:'flex'}}>{item.type==='call'?I.callReceive({s:14,c:'#171717'}):I.sms({s:14,c:'#171717'})}</span>
                        <span style={{fontSize:14,fontWeight:600,color:'#171717'}}>{item.type==='call'?'Call':'Text'}</span>
                        <span style={{fontSize:11,color:'#a3a3a3',marginLeft:'auto'}}>{item.time}</span>
                      </div>
                      {item.summary&&<div style={{fontSize:13,color:'#171717',fontStyle:'italic',lineHeight:1.35}}>{item.summary}</div>}
                      {item.text&&<div style={{fontSize:13,color:'#171717',fontStyle:'italic',lineHeight:1.35,marginTop:3}}>{item.text}</div>}
                    </div>
                  </div>
                ))}
                {openThread.serviceEvent&&(
                  <>
                    <div style={{textAlign:'center',padding:'4px 0 10px'}}>
                      <span style={{fontSize:11,fontWeight:500,color:'#a3a3a3',background:'#f5f5f5',padding:'3px 10px',borderRadius:10}}>{openThread.serviceEvent.date}</span>
                    </div>
                    <div style={{marginBottom:10}}>
                      <div style={{padding:'10px 12px',background:'#f5f5f5',borderRadius:10,border:'1px solid #e5e5e5'}}>
                        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                          <span style={{display:'flex'}}>{I.calendar({s:14,c:'#171717'})}</span>
                          <span style={{fontSize:14,fontWeight:600,color:'#171717'}}>Event</span>
                        </div>
                        <div style={{fontSize:13,fontWeight:600,color:'#171717',lineHeight:1.35}}>{openThread.serviceEvent.title}</div>
                        <div style={{fontSize:12,color:'#737373',lineHeight:1.35,marginTop:2}}>{openThread.serviceEvent.scheduled}</div>
                      </div>
                    </div>
                  </>
                )}
              </div>
              <div style={{padding:'10px 16px',borderTop:'1px solid #e5e5e5',flexShrink:0}}>
                <div style={{padding:'10px 12px',background:'#f5f5f5',borderRadius:12,border:'1px solid #e5e5e5'}}>
                  <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:4}}>
                    <span style={{display:'flex'}}>{openThread.sendAs==='call'?I.outbound({s:12,c:'#171717'}):I.sms({s:12,c:'#171717'})}</span>
                    <span style={{fontSize:11,fontWeight:600,color:'#171717'}}>{openThread.sendAs==='call'?'AI Call':'Text'}</span>
                  </div>
                  <div style={{fontSize:13,color:'#737373',lineHeight:1.5}}>{openThread.sendAs==='call'?openThread.callDraft:openThread.textDraft}</div>
                </div>
                <div style={{display:'flex',gap:8,marginTop:8}}>
                  <button className="btn-primary" style={{fontSize:14,height:40}} onClick={()=>{setSentIds(p=>[...p,openThread.id]);setOpenThread(null)}}>
                    {openThread.sendAs==='call'?'Place AI Call':'Send Text'}
                  </button>
                </div>
              </div>
            </div>
          ):(
            <div className="web-detail-empty">
              {I.messageSquare({s:48,c:'#a3a3a3'})}
              <p>Select a conversation to view details.</p>
            </div>
          )}
        </div>
        </>}
      </div>
    </div>
  );
}

// ── App (embed) ──
function App(){
  const[industry,setIndustry]=useState('pharmacy');
  const isOncologyApp=industry==='oncology';
  const[tags,setTags]=useState(isOncologyApp?ONCOLOGY_FILTER_LABELS:PHARMACY_FILTER_LABELS);
  const[showTagsModal,setShowTagsModal]=useState(false);

  // Sync tags when industry changes
  const prevIndustry=useRef(industry);
  if(prevIndustry.current!==industry){
    prevIndustry.current=industry;
    // We handle this via a key on WebInboxScreen instead
  }

  // Reset tags when industry changes
  const handleSetIndustry=(ind)=>{
    setIndustry(ind);
    setTags(ind==='oncology'?ONCOLOGY_FILTER_LABELS:PHARMACY_FILTER_LABELS);
  };

  return(
    <>
      <WebInboxScreen key={industry} tags={tags} setTags={setTags} onManageTags={()=>setShowTagsModal(true)} industry={industry} setIndustry={handleSetIndustry}/>
      {showTagsModal&&<TagManagementModal tags={tags} setTags={setTags} onClose={()=>setShowTagsModal(false)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
// Auto-scale to fit iframe container
function autoScale(){
  const s=Math.min(window.innerWidth/1200,window.innerHeight/720);
  document.getElementById('root').style.transform='scale('+s+')';
}
window.addEventListener('resize',autoScale);
window.addEventListener('load',()=>setTimeout(autoScale,100));
autoScale();
</script>
</body>
</html>
