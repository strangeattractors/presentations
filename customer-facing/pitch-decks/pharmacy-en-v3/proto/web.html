<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouSquared — Team Viral Self-Serve</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:transparent;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:0}
#root{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;height:100vh}

/* ── Design tokens (from Theme.swift + Color+Ext.swift) ── */
:root{
  --accent:#FF8370;--accent-dark:#E07A5F;--accent-surface:#FF8370;
  --primary-text:#2D2A26;--secondary-text:#6B6560;--tertiary-text:#9E9893;
  --bg:#FFFFFF;--bg-primary:#FAF8F6;
  --surface-dark:#F8F6F4;--surface-darken:#F0EDEA;--surface-black:#2D2A26;
  --border:#E8E4E0;--input-bg:#F5F2EF;--input-stroke:#D8D4D0;
  --error:#E53935;--green:#43A047;--gold:#FFB300;--blue:#1E88E5;
  --accent-12:rgba(255,131,112,0.12);
  --on-label:#FFFFFF;
  /* Theme.swift spacing */
  --xs:4px;--sm:10px;--normal:16px;--md:20px;--lg:30px;--xl:40px;
  /* Theme.swift radius */
  --r-sm:8px;--r:10px;--r-lg:12px;--r-xl:18px;--r-xxl:30px;
  /* Theme.swift sizes */
  --cell-h:56px;--btn-h:48px;
}

/* ── Screen navigator ── */
.nav-bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px 16px;max-width:900px}
.nav-btn{padding:6px 14px;border-radius:var(--r-xxl);border:1.5px solid #555;background:transparent;color:#aaa;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.nav-btn:hover{border-color:#888;color:#fff}
.nav-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Phone frame (iPhone 15 Pro: 393×852) ── */
.phone{width:393px;height:854px;border-radius:44px;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4);flex-shrink:0;display:flex;flex-direction:column}

/* Status bar */
.status-bar{height:54px;padding:14px 30px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;color:var(--primary-text);flex-shrink:0;position:relative}
.dynamic-island{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:126px;height:37px;background:#000;border-radius:22px}
.status-icons{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--primary-text)}

/* Scrollable content */
.screen-content{flex:1;overflow-y:auto;overflow-x:hidden}
.screen-content::-webkit-scrollbar{display:none}
.pill-scroll::-webkit-scrollbar{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Floating tab bar (from FloatingTabBar.swift) ── */
/* Capsule pill: 210×56, surfaceDarken fill, with assistant button */
.tab-bar-area{height:76px;padding:0 var(--normal) 4px;display:flex;align-items:center;flex-shrink:0}
.tab-pill{display:flex;height:56px;width:210px;background:var(--surface-darken);border-radius:28px;overflow:hidden;align-items:center;padding:0}
.tab-item{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;cursor:pointer;padding:0 4px;flex:none;width:50px;border-radius:25px;transition:all .25s}
.tab-item.active{background:var(--primary-text);flex:1;width:auto}
.tab-item .tab-icon{font-size:18px;filter:none;transition:filter .2s}
.tab-item.active .tab-icon{filter:brightness(0) invert(1)}
.tab-item .tab-label{display:none;font-size:15px;font-weight:500;color:var(--on-label);white-space:nowrap}
.tab-item.active .tab-label{display:block}
.tab-spacer{flex:1;min-width:20px}
.assistant-btn{width:56px;height:56px;border-radius:28px;background:var(--surface-darken);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:24px;border:none}

/* ── Common components matching SwiftUI code ── */

/* SearchBar (padding:10px 14px, inputBg, radius:10) */
.search-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--input-bg);border-radius:var(--r);margin:0 var(--normal)}
.search-bar input{border:none;background:transparent;outline:none;font-size:15px;font-family:inherit;color:var(--primary-text);flex:1}
.search-bar input::placeholder{color:var(--tertiary-text)}
.search-bar .search-icon{color:var(--tertiary-text);font-size:15px}

/* Section header (footnoteRU: 13px medium uppercase) */
.section-header{font-size:13px;font-weight:500;text-transform:uppercase;color:var(--secondary-text);padding:var(--normal) var(--normal) var(--r-sm);letter-spacing:.5px}

/* Card (.cardStyle(): 16px padding, radiusLarge corners, surfaceDarken bg) */
.card{padding:var(--normal);background:var(--surface-dark);border-radius:var(--r-lg);border:.5px solid var(--border)}

/* TagView (caption font, 4px corner radius, color from name, .05 opacity bg) */
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:0 6px;height:20px;border-radius:4px;line-height:20px}

/* Filter pills */
.pill{padding:6px 14px;border-radius:var(--r-xxl);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.pill.active{background:var(--primary-text);color:var(--on-label)}
.pill.inactive{background:var(--surface-darken);color:var(--secondary-text)}

/* Avatar (deterministic color from name) */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex-shrink:0}

/* Primary button (48px, accent, white, r-xxl, 17px semibold) */
.btn-primary{padding:14px;background:var(--accent);color:#fff;border-radius:var(--r-xxl);font-size:17px;font-weight:600;border:none;width:100%;cursor:pointer;font-family:inherit;height:var(--btn-h);transition:background .15s}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{padding:14px;background:var(--surface-darken);color:var(--primary-text);border-radius:var(--r-xxl);font-size:17px;font-weight:600;border:none;width:100%;cursor:pointer;font-family:inherit;height:var(--btn-h)}

/* Input field */
.input-field{padding:12px 14px;background:var(--input-bg);border-radius:var(--r);border:.5px solid var(--input-stroke);font-size:15px;font-family:inherit;color:var(--primary-text);width:100%;outline:none;resize:none}
.input-field::placeholder{color:var(--tertiary-text)}
.input-field:focus{border-color:var(--accent)}

/* Back button */
.back-btn{font-size:22px;color:var(--accent);cursor:pointer;background:none;border:none;padding:4px;font-family:inherit}
.nav-header{display:flex;align-items:center;padding:8px var(--normal);gap:8px;min-height:44px}

/* Toggle (51×31) */
.toggle{width:51px;height:31px;border-radius:16px;position:relative;cursor:pointer;transition:background .25s;flex-shrink:0}
.toggle.on{background:var(--green)}.toggle.off{background:var(--border)}
.toggle-knob{width:27px;height:27px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:left .25s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle.on .toggle-knob{left:22px}.toggle.off .toggle-knob{left:2px}

/* ── Contact Preview List Cell (from ContactPreviewListCell.swift) ── */
/* frameSize:44, imageSize:24, cellSize:78 */
.contact-cell{display:flex;align-items:flex-start;padding:0 var(--normal);height:78px;cursor:pointer;position:relative}
.contact-cell:hover{background:var(--surface-dark)}
.contact-cell-icon{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;margin-top:18px;font-size:18px}
.contact-cell-body{flex:1;padding-top:6px;padding-bottom:6px;display:flex;flex-direction:column;gap:3px;height:78px;justify-content:center;border-bottom:.5px solid var(--border);padding-left:3px}
.contact-cell-name{font-size:17px;color:var(--primary-text);line-height:1.3}
.contact-cell-name.unread{font-weight:700}
.contact-cell-name.read{font-weight:400}
.contact-cell-preview{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.contact-cell-preview.unread{color:var(--primary-text);font-weight:500}
.contact-cell-preview.read{color:var(--secondary-text);font-weight:400}
.contact-cell-date{font-size:13px}
.contact-cell-date.unread{font-weight:700;color:var(--primary-text)}
.contact-cell-date.read{font-weight:400;color:var(--primary-text)}
/* To-Do badge (accent bg, white footnoteS text) */
.todo-badge{font-size:13px;font-weight:600;color:var(--bg);padding:2px 6px;background:var(--accent);border-radius:4px;line-height:1}

/* ── Contact Header (from ContactHeaderView.swift) ── */
/* Avatar 64×64, name title3 medium, phone footnote secondary */
.contact-header{padding:8px var(--normal) 8px}
.contact-header-row{display:flex;align-items:center;gap:12px}
.contact-header-name{font-size:22px;font-weight:500;color:var(--primary-text);display:flex;align-items:center;gap:6px}
.contact-header-phone{font-size:13px;color:var(--secondary-text);margin-top:2px}

/* Action buttons row (from ContactDetailView: 3 equal width) */
.action-buttons{display:flex;gap:10px;padding:var(--sm) var(--normal) var(--normal)}
.action-btn{flex:1;height:var(--cell-h);border-radius:var(--r-lg);background:var(--surface-darken);border:none;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:15px;font-weight:500;color:var(--primary-text);font-family:inherit}

/* ── Event timeline ── */
.timeline-item{display:flex;gap:12px;padding:0 var(--normal);position:relative}
.timeline-line{width:2px;background:var(--border);position:absolute;left:27px;top:28px;bottom:-12px}
.timeline-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0;z-index:1}
.timeline-content{flex:1;padding-bottom:var(--normal)}
.timeline-date{font-size:12px;color:var(--tertiary-text);font-weight:500}
.timeline-text{font-size:15px;color:var(--primary-text);margin-top:2px;line-height:1.4}

/* ── NextStepsListView (border:1px, radiusLarge, bg white) ── */
.nextsteps-card{padding:var(--r-lg);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg)}
.nextsteps-header{display:flex;align-items:center;gap:8px}
.nextsteps-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;transition:all .2s}
.nextsteps-check.done{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Outbound To-Do items ── */
.outbound-item{display:flex;gap:12px;padding:14px var(--normal);align-items:flex-start;border-bottom:.5px solid var(--border);cursor:pointer}
.outbound-item:last-child{border-bottom:none}
.outbound-badge{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

/* ── Draft review bar (SuggestedMessageBar-inspired) ── */
.draft-bar{margin:0 var(--normal) 12px;padding:12px var(--normal);background:var(--accent-12);border:1px solid var(--accent);border-radius:24px}
.draft-label{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.draft-text{font-size:15px;color:var(--primary-text);line-height:1.45;font-style:italic}

/* Send-as toggle */
.type-toggle{display:flex;border-radius:20px;overflow:hidden;border:1px solid var(--border)}
.type-btn{padding:6px 12px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
.type-btn.active{background:var(--primary-text);color:#fff}
.type-btn.inactive{background:var(--bg);color:var(--secondary-text)}

/* ── Scenario cards ── */
.scenario-card{padding:var(--normal);background:var(--surface-dark);border-radius:var(--r-lg);border:.5px solid var(--border);margin-bottom:12px}
.scenario-type{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;text-transform:uppercase}

/* ── Bottom sheet ── */
.sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end;border-radius:44px;overflow:hidden}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-height:75%;overflow-y:auto;padding-bottom:34px;animation:slideUp .3s ease-out}
.sheet::-webkit-scrollbar{display:none}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:5px;border-radius:3px;background:var(--border);margin:8px auto 12px}

/* ── Notification lock screen ── */
.notif-card{background:rgba(255,255,255,.12);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.notif-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.notif-app-icon{width:20px;height:20px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700}
.notif-actions{display:flex;gap:8px;margin-top:10px}
.notif-action-btn{flex:1;padding:8px;border-radius:14px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit}

/* ── Industry picker ── */
.industry-option{display:flex;align-items:center;padding:14px var(--normal);border-bottom:.5px solid var(--border);cursor:pointer;transition:background .1s}
.industry-option:hover{background:var(--surface-dark)}
.industry-option:last-child{border-bottom:none}
.industry-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin-right:12px;font-size:14px}
.industry-check.selected{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Team Viral Self-Serve ── */

/* Hero invite banner (dark gradient card with coral glow) */
.team-banner{position:relative;border-radius:var(--r-xl);padding:24px 20px;overflow:hidden;cursor:pointer;margin:0 var(--normal) 12px}
.team-banner-bg{position:absolute;inset:0;background:linear-gradient(135deg,#2D2A26 0%,#3D3832 50%,#2D2A26 100%);z-index:0}
.team-banner-glow{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,131,112,.25) 0%,transparent 70%);z-index:1}
.team-banner-content{position:relative;z-index:2}

/* Promo carousel card */
.promo-card{border-radius:var(--r-xl);padding:20px;position:relative;overflow:hidden}

/* Team member row */
.team-member{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--border)}
.team-member:last-child{border-bottom:none}

/* Plan card for onboarding */
.plan-card{border-radius:var(--r-lg);padding:var(--normal);border:2px solid var(--border);cursor:pointer;transition:all .2s}
.plan-card.selected{border-color:var(--accent);background:var(--accent-12)}
.plan-card-badge{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase}

/* Share action list */
.share-action{display:flex;align-items:center;gap:14px;padding:14px var(--normal);cursor:pointer;transition:background .1s}
.share-action:hover{background:var(--surface-dark)}
.share-action-icon{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Confetti animation */
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(40px) rotate(360deg);opacity:0}}

/* ── Platform toggle ── */
.platform-toggle{display:inline-flex;border-radius:8px;border:1.5px solid #555;overflow:hidden;margin-bottom:8px}
.platform-btn{padding:6px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;border:none;background:transparent;color:#aaa}
.platform-btn.active{background:var(--accent);color:#fff}

/* ══ WEB APP FRAME ══ */
.web-frame{width:100%;max-width:960px;height:100vh;border-radius:12px;background:#f4f4f5;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;flex-shrink:0;border:1px solid rgba(0,0,0,.06)}
.web-titlebar{height:36px;background:#e4e4e7;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.web-dot{width:12px;height:12px;border-radius:6px}
.web-urlbar{flex:1;height:22px;background:#fff;border-radius:6px;margin:0 40px;display:flex;align-items:center;padding:0 10px;font-size:11px;color:#71717a}
.web-body{flex:1;display:flex;overflow:hidden}

/* Sidebar (matches real web app: w-64 border-r bg-muted/40) */
.web-sidebar{width:220px;background:#fafafa;border-right:1px solid #e4e4e7;display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0;overflow-y:auto}
.web-sidebar::-webkit-scrollbar{display:none}
.web-sidebar-logo{display:flex;align-items:center;gap:8px;padding:4px 8px;margin-bottom:20px}
.web-sidebar-section{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:#a1a1aa;padding:0 8px;margin:16px 0 6px}
.web-nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13px;color:#3f3f46;cursor:pointer;transition:background .15s;font-weight:400}
.web-nav-item:hover{background:#f0f0f0}
.web-nav-item.active{background:#f0f0f0;font-weight:500;color:#18181b}
.web-nav-item .nav-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:#71717a}
.web-nav-item.active .nav-icon{color:#18181b}

/* Main content area */
.web-main{flex:1;overflow-y:auto;background:#fafafa;padding:0}
.web-main::-webkit-scrollbar{display:none}

/* Settings page shell (matches bg-muted/40, p-6, max-w-6xl) */
.web-page{padding:32px 40px;max-width:800px}
.web-page-title{font-size:22px;font-weight:600;color:#18181b;margin-bottom:4px}
.web-page-sub{font-size:14px;color:#71717a;margin-bottom:24px}

/* Settings card (matches rounded-lg border bg-background p-8) */
.web-card{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:24px;margin-bottom:16px}
.web-card-title{font-size:16px;font-weight:600;color:#18181b;margin-bottom:4px}
.web-card-sub{font-size:13px;color:#71717a;margin-bottom:16px}

/* Web buttons */
.web-btn{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.web-btn-primary{background:#18181b;color:#fff}.web-btn-primary:hover{background:#27272a}
.web-btn-accent{background:var(--accent);color:#fff}.web-btn-accent:hover{background:var(--accent-dark)}
.web-btn-outline{background:#fff;color:#18181b;border:1px solid #e4e4e7}.web-btn-outline:hover{background:#f4f4f5}
.web-btn-ghost{background:transparent;color:#71717a}.web-btn-ghost:hover{background:#f4f4f5;color:#18181b}

/* Web input */
.web-input{padding:8px 12px;border:1px solid #e4e4e7;border-radius:6px;font-size:13px;font-family:inherit;color:#18181b;outline:none;width:100%}
.web-input:focus{border-color:#a1a1aa;box-shadow:0 0 0 2px rgba(0,0,0,.05)}
.web-input::placeholder{color:#a1a1aa}

/* Web table */
.web-table{width:100%;border-collapse:collapse}
.web-table th{text-align:left;font-size:12px;font-weight:500;color:#71717a;padding:8px 12px;border-bottom:1px solid #e4e4e7}
.web-table td{font-size:13px;color:#18181b;padding:10px 12px;border-bottom:1px solid #f4f4f5}
.web-table tr:last-child td{border-bottom:none}

/* Web badge */
.web-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:500}

/* Web tabs */
.web-tabs{display:flex;border-bottom:1px solid #e4e4e7;margin-bottom:20px}
.web-tab{padding:8px 16px;font-size:13px;font-weight:500;color:#71717a;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.web-tab.active{color:#18181b;border-bottom-color:#18181b}
.web-tab:hover{color:#18181b}

/* Web hero banner */
.web-hero-banner{position:relative;border-radius:10px;padding:28px 32px;overflow:hidden;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useRef}=React;

// ── Solar Icon Library (SVG, 24×24, 1.5px stroke, currentColor) ──

const avatarColors=['#E07A5F','#3D5A80','#81B29A','#F2CC8F','#6D597A','#B56576','#355070','#E56B6F'];
const avatarColor=n=>{let h=0;for(let c of n)h=c.charCodeAt(0)+((h<<5)-h);return avatarColors[Math.abs(h)%avatarColors.length]};
const initials=(fn,ln)=>`${(fn||'')[0]||''}${(ln||'')[0]||''}`.toUpperCase();
const tagColor=t=>{let h=0;for(let c of t)h=c.charCodeAt(0)+((h<<5)-h);return avatarColors[Math.abs(h)%avatarColors.length]};

// ── Shared Components ──
function StatusBar(){
  return(<div className="status-bar"><span>9:41</span><div className="dynamic-island"/><div className="status-icons"><svg width="17" height="12" viewBox="0 0 17 12"><path d="M1 8h2v4H1zM5 5h2v7H5zM9 2h2v10H9zM13 0h2v12h-2z" fill="var(--primary-text)"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="0" width="22" height="12" rx="3" stroke="var(--primary-text)" strokeWidth="1" fill="none"/><rect x="23" y="3.5" width="2" height="5" rx="1" fill="var(--primary-text)" opacity=".4"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="var(--green)"/></svg></div></div>);
}

function FloatingTabBar({active='inbox',onTabTap}){
  const tabs=[{id:'inbox',icon:()=>I.inbox({s:20}),label:'Inbox'},{id:'contacts',icon:()=>I.contacts({s:20}),label:'Contacts'},{id:'profile',icon:()=>I.settings({s:20}),label:'Settings'}];
  return(
    <div className="tab-bar-area">
      <div className="tab-pill">
        {tabs.map(t=>(
          <div key={t.id} className={`tab-item ${active===t.id?'active':''}`} onClick={()=>onTabTap&&onTabTap(t.id)} style={{cursor:'pointer'}}>
            <span className="tab-icon">{t.icon()}</span>
            <span className="tab-label">{t.label}</span>
          </div>
        ))}
      </div>
      <div className="tab-spacer"/>
      <button className="assistant-btn" style={{background:'var(--surface-darken)',border:'none'}}><span style={{fontSize:22,filter:'none'}}>🌀</span></button>
    </div>
  );
}

function Avatar({name,size=40}){
  const p=name.split(' ');
  return <div className="avatar" style={{width:size,height:size,fontSize:size*.38,background:avatarColor(name)}}>{initials(p[0],p[1])}</div>;
}

function Tag({text,color:c}){
  const col=c||tagColor(text);
  return <span className="tag" style={{color:col,background:`${col}11`,border:`1px solid ${col}30`}}>{text}</span>;
}

function Toggle({on,onToggle}){
  return <div className={`toggle ${on?'on':'off'}`} onClick={onToggle}><div className="toggle-knob"/></div>;
}

// ── Chevron pill component (reusable) ──
function ChevPill({label,options,value,onChange}){
  const[open,setOpen]=useState(false);
  return(<span style={{position:'relative',display:'inline-flex'}}>
    <span onClick={(e)=>{e.stopPropagation();setOpen(!open)}} style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 4px 2px 6px',background:'var(--surface-darken)',borderRadius:10,border:'.5px solid var(--border)',cursor:'pointer'}}>
      <span style={{fontSize:14,fontWeight:600,color:'var(--primary-text)'}}>{value||label}</span>
      <span style={{display:'flex',alignItems:'center',justifyContent:'center',width:16,height:16,borderRadius:8,border:'.75px solid var(--primary-text)',background:'transparent'}}>{I.chevronDown({s:8,c:'var(--primary-text)'})}</span>
    </span>
    {open&&<div style={{position:'absolute',top:'100%',left:0,marginTop:4,background:'var(--bg)',borderRadius:10,border:'.5px solid var(--border)',boxShadow:'0 4px 16px rgba(0,0,0,.12)',zIndex:20,minWidth:140,overflow:'hidden'}}>
      {options.map((o,i)=><div key={i} onClick={(e)=>{e.stopPropagation();onChange(o);setOpen(false)}} style={{padding:'10px 14px',fontSize:14,color:o===value?'var(--accent)':'var(--primary-text)',fontWeight:o===value?600:400,cursor:'pointer',borderBottom:i<options.length-1?'.5px solid var(--border)':'none'}}>{o}</div>)}
    </div>}
  </span>);
}

function TodoScreen({onNavigate}){
  const[filter,setFilter]=useState('todo');
  const[openThread,setOpenThread]=useState(null);
  const[threadSendAs,setThreadSendAs]=useState('text'); // 'text' or 'call'
  const[draftEditing,setDraftEditing]=useState(false);
  const[editedDraft,setEditedDraft]=useState('');
  const[sentIds,setSentIds]=useState([]);
  const[simState,setSimState]=useState(null); // null|'loading'|'playing'|'done'
  const[simLines,setSimLines]=useState([]);
  const[simIdx,setSimIdx]=useState(0);
  const simScrollRef=useRef(null);
  const pending=TODOS.filter(t=>!sentIds.includes(t.id));
  const sent=TODOS.filter(t=>sentIds.includes(t.id));

  // ── Full-page thread view (pushed on NavigationStack) ──
  const triggerRef=useRef(null);
  const scrollRef=useRef(null);
  // Auto-scroll to trigger event on open
  React.useEffect(()=>{
    if(openThread&&triggerRef.current){
      // Wait for DOM to render fully, then scroll trigger event to top of scroll area
      const t=setTimeout(()=>{
        if(triggerRef.current&&scrollRef.current){
          const containerRect=scrollRef.current.getBoundingClientRect();
          const elRect=triggerRef.current.getBoundingClientRect();
          // Scroll so the event card sits at the BOTTOM of the visible scroll area
          // (right above the draft bar), not at the top
          const containerH=containerRect.height;
          const elH=triggerRef.current.offsetHeight;
          const dateH=30; // date pill above the event
          const targetOffset=elRect.top-containerRect.top-(containerH-elH-dateH);
          scrollRef.current.scrollTop+=targetOffset;
        }
      },150);
      return ()=>clearTimeout(t);
    }
  },[openThread]);
  // Simulation playback — reveal lines one by one
  React.useEffect(()=>{
    if(simState==='playing'&&openThread){
      const tx=TRANSCRIPTS[openThread.id];
      const lines=tx._simLines||tx.lines;
      if(tx&&simIdx<lines.length){
        const line=lines[simIdx];
        const delay=line.w==='t'?800:line.w==='s'?1500:1200;
        const t=setTimeout(()=>{
          setSimLines(l=>[...l,lines[simIdx]]);
          setSimIdx(i=>i+1);
          if(simScrollRef.current)simScrollRef.current.scrollTop=simScrollRef.current.scrollHeight;
        },delay);
        return()=>clearTimeout(t);
      }else if(tx&&simIdx>=lines.length){
        setSimState('done');
        setSentIds(p=>[...p,openThread.id]);
      }
    }
  },[simState,simIdx,openThread]);

  // ── Simulation view ──
  if(openThread&&simState){
    const tx=TRANSCRIPTS[openThread.id]||{};
    const isCall=threadSendAs==='call';
    return(
      <div className="phone">
        <StatusBar/>
        <div style={{display:'flex',alignItems:'center',padding:'2px 16px 6px',gap:10,borderBottom:'.5px solid var(--border)',flexShrink:0}}>
          <button className="back-btn" style={{padding:0}} onClick={()=>{setSimState(null);setSimLines([]);setSimIdx(0);}}>&#8249;</button>
          <Avatar name={openThread.contact} size={36}/>
          <div style={{flex:1}}>
            <div style={{fontSize:17,fontWeight:600,color:'var(--primary-text)'}}>{openThread.contact}</div>
            <div style={{fontSize:12,color:simState==='loading'?'var(--accent)':simState==='playing'?'var(--green)':'var(--secondary-text)'}}>{simState==='loading'?(isCall?'Placing AI call...':'Sending text...'):(simState==='playing'?(isCall?'AI call in progress...':'Conversation in progress...'):'Completed')}</div>
          </div>
          {simState==='playing'&&<div style={{width:10,height:10,borderRadius:5,background:'var(--green)',animation:'pulse 1.5s infinite'}}/>}
        </div>
        {simState==='loading'?(
          <div className="screen-content" style={{display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)'}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:40,marginBottom:16}}>{isCall?'📞':'📱'}</div>
              <div style={{fontSize:17,fontWeight:600,color:'var(--primary-text)',marginBottom:4}}>{isCall?'Placing AI call...':'Sending text...'}</div>
              <div style={{fontSize:14,color:'var(--secondary-text)'}}>{openThread.contact}</div>
            </div>
          </div>
        ):(
          <div className="screen-content" ref={simScrollRef} style={{background:'var(--bg)',padding:'12px 16px'}}>
            {simLines.map((line,i)=>{
              const isAI=line.w==='a';
              const isSys=line.w==='s';
              const isText=line.w==='t';
              if(isSys) return <div key={i} style={{textAlign:'center',padding:'8px 0',fontSize:13,color:'var(--secondary-text)',fontStyle:'italic',animation:'fadeIn .3s ease'}}>{line.t}</div>;
              if(isText) return(
                <div key={i} style={{display:'flex',justifyContent:'flex-end',marginBottom:8,animation:'fadeIn .3s ease'}}>
                  <div style={{maxWidth:'85%',padding:'10px 14px',borderRadius:'16px 16px 4px 16px',background:'var(--surface-darken)',border:'.5px solid var(--border)',color:'var(--primary-text)',fontSize:15,lineHeight:1.4}}>
                    <div style={{fontSize:11,fontWeight:600,color:'var(--tertiary-text)',marginBottom:4,textTransform:'uppercase'}}>Text sent</div>
                    {line.t}
                  </div>
                </div>
              );
              return(
                <div key={i} style={{display:'flex',justifyContent:isAI?'flex-start':'flex-end',marginBottom:8,animation:'fadeIn .3s ease'}}>
                  <div style={{maxWidth:'80%',padding:'10px 14px',borderRadius:isAI?'16px 16px 16px 4px':'16px 16px 4px 16px',background:isAI?'var(--surface-dark)':'var(--accent)',color:isAI?'var(--primary-text)':'#fff',fontSize:15,lineHeight:1.4}}>
                    {line.t}
                  </div>
                </div>
              );
            })}
            {simState==='done'&&tx.label&&(
              <div style={{textAlign:'center',padding:'16px 0'}}>
                <div style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 16px',borderRadius:20,background:tx.outcome==='booked'?'#E8F5E9':tx.outcome==='transfer'?'#E3F2FD':'var(--surface-darken)'}}>
                  <span style={{fontSize:14}}>{tx.outcome==='booked'?'✅':tx.outcome==='transfer'?'📞':'👋'}</span>
                  <span style={{fontSize:14,fontWeight:600,color:tx.outcome==='booked'?'var(--green)':tx.outcome==='transfer'?'var(--blue)':'var(--secondary-text)'}}>{tx.label}</span>
                </div>
                <div style={{marginTop:12}}>
                  <button className="btn-secondary" style={{width:'auto',padding:'10px 24px',fontSize:14}} onClick={()=>{setSimState(null);setSimLines([]);setSimIdx(0);setOpenThread(null)}}>Back to To-Do</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  if(openThread){
    return(
      <div className="phone">
        <StatusBar/>
        {/* Compact header: back + name + tag */}
        <div style={{display:'flex',alignItems:'center',padding:'2px 16px 6px',gap:10,borderBottom:'.5px solid var(--border)',flexShrink:0}}>
          <button className="back-btn" style={{padding:0}} onClick={()=>{setOpenThread(null);setDraftEditing(false)}}>‹</button>
          <Avatar name={openThread.contact} size={36}/>
          <div style={{flex:1}}>
            <div style={{fontSize:17,fontWeight:600,color:'var(--primary-text)'}}>{openThread.displayContact||openThread.contact}</div>
            <div style={{fontSize:12,color:'var(--secondary-text)'}}>{openThread.rel}</div>
          </div>
          <Tag text={openThread.rel}/>
        </div>

        {/* Thread content — ONLY thread items scroll */}
        <div className="screen-content" ref={scrollRef} style={{background:'var(--bg)',padding:'0 16px'}}>
          {/* Earlier interactions */}
          <div style={{textAlign:'center',padding:'8px 0 10px'}}>
            <span style={{fontSize:12,fontWeight:500,color:'var(--tertiary-text)',background:'var(--surface-darken)',padding:'4px 12px',borderRadius:12}}>Earlier</span>
          </div>
          {(openThread.earlierItems||[{type:'call',direction:'in',time:'2:13p',summary:openThread.prevCall}]).map((item,i)=>(
            <div key={'e'+i} style={{marginBottom:12,...(item.direction==='out'?{marginLeft:32}:{marginRight:32})}}>
              <div style={{padding:'12px 14px',background:item.direction==='out'?'var(--surface-darken)':'var(--surface-dark)',borderRadius:'var(--r-lg)',border:'.5px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:item.text?0:6}}>
                  <span style={{display:'flex'}}>{item.type==='call'?I.callReceive({s:18,c:'var(--primary-text)'}):I.sms({s:18,c:'var(--primary-text)'})}</span>
                  <span style={{fontSize:17,fontWeight:600,color:'var(--primary-text)'}}>{item.type==='call'?'Call':'Text'}</span>
                  <span style={{fontSize:12,color:'var(--secondary-text)',marginLeft:'auto'}}>{item.time}</span>
                </div>
                {item.summary&&<div style={{fontSize:15,color:'var(--primary-text)',fontStyle:'italic',lineHeight:1.4}}>{item.summary}</div>}
                {item.text&&<div style={{fontSize:15,color:'var(--primary-text)',fontStyle:'italic',lineHeight:1.4,marginTop:4}}>{item.text}</div>}
              </div>
            </div>
          ))}
          {/* Service event — bold title + scheduled line */}
          {openThread.serviceEvent&&(<>
            <div style={{textAlign:'center',padding:'4px 0 10px'}}>
              <span style={{fontSize:12,fontWeight:500,color:'var(--tertiary-text)',background:'var(--surface-darken)',padding:'4px 12px',borderRadius:12}}>{openThread.serviceEvent.date}</span>
            </div>
            <div style={{marginBottom:12}} ref={triggerRef}>
              <div style={{padding:'12px 14px',background:'var(--surface-dark)',borderRadius:'var(--r-lg)',border:'.5px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                  <span style={{display:'flex'}}>{I.calendar({s:18,c:'var(--primary-text)'})}</span>
                  <span style={{fontSize:17,fontWeight:600,color:'var(--primary-text)'}}>Event</span>
                </div>
                <div style={{fontSize:15,fontWeight:600,color:'var(--primary-text)',lineHeight:1.4}}>{openThread.serviceEvent.title}</div>
                <div style={{fontSize:14,color:'var(--secondary-text)',lineHeight:1.4,marginTop:2}}>{openThread.serviceEvent.scheduled}</div>
              </div>
            </div>
          </>)}
          {/* Recent items after the trigger event */}
          {openThread.recentItems&&openThread.recentItems.map((item,i)=>{
            const isOut=item.direction==='out';
            const isAICall=item.type==='call'&&isOut;
            return(
            <div key={i} style={{marginBottom:12,...(isOut?{marginLeft:32}:{marginRight:32})}}>
              <div style={{padding:'12px 14px',background:isOut?'var(--surface-darken)':'var(--surface-dark)',borderRadius:'var(--r-lg)',border:'.5px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:item.text?0:6}}>
                  <span style={{display:'flex'}}>{isAICall?I.outbound({s:18,c:'var(--primary-text)'}):item.type==='call'?I.callReceive({s:18,c:'var(--primary-text)'}):I.sms({s:18,c:'var(--primary-text)'})}</span>
                  <span style={{fontSize:17,fontWeight:600,color:'var(--primary-text)'}}>{isAICall?'AI Call':item.type==='call'?'Call':'Text'}</span>
                  <span style={{fontSize:12,color:'var(--secondary-text)',marginLeft:'auto'}}>{item.time}</span>
                </div>
                {item.summary&&<div style={{fontSize:15,color:'var(--primary-text)',fontStyle:'italic',lineHeight:1.4}}>{item.summary}</div>}
                {item.text&&<div style={{fontSize:15,color:'var(--primary-text)',fontStyle:'italic',lineHeight:1.4,marginTop:4}}>{item.text}</div>}
              </div>
            </div>
            );
          })}
          <div style={{height:8}}/>
        </div>

        {/* Draft bar — FIXED, does not scroll */}
        <div style={{padding:'6px 16px 4px',borderTop:'.5px solid var(--border)',background:'var(--bg)',flexShrink:0}}>
          {(() => {
            const activeDraft = threadSendAs==='call' ? openThread.callDraft : openThread.textDraft;
            const isCall = threadSendAs==='call';
            return (
            <div style={{display:'flex',alignItems:'flex-end',gap:8}}>
              <div style={{flex:1,padding:'8px 10px',background:'var(--input-bg)',borderRadius:24,border:'.5px solid var(--input-stroke)',maxHeight:draftEditing?140:88,overflow:'auto'}}
                onDoubleClick={()=>{if(!draftEditing){setDraftEditing(true);setEditedDraft(activeDraft)}}}
              >
                {!draftEditing?(
                  <div>
                    <div style={{fontSize:15,color:'var(--secondary-text)',lineHeight:1.6}}>
                      <span
                        onClick={(e)=>{e.stopPropagation();setThreadSendAs(isCall?'text':'call');setDraftEditing(false);setEditedDraft('')}}
                        style={{display:'inline-flex',alignItems:'center',gap:3,padding:'1px 4px 1px 5px',background:'var(--surface-darken)',borderRadius:10,border:'.5px solid var(--border)',cursor:'pointer',verticalAlign:'middle',marginRight:4}}
                      >
                        <span style={{display:'flex'}}>{isCall ? I.outbound({s:13,c:'var(--primary-text)'}) : I.sms({s:13,c:'var(--primary-text)'})}</span>
                        <span style={{fontSize:12,fontWeight:600,color:'var(--primary-text)',lineHeight:'18px'}}>{isCall?'AI Call':'Text'}</span>
                        <span style={{display:'flex',alignItems:'center',justifyContent:'center',width:18,height:18,borderRadius:9,border:'.75px solid var(--primary-text)',background:'transparent',marginLeft:1}}>{I.chevronDown({s:10,c:'var(--primary-text)'})}</span>
                      </span>
                      {activeDraft}
                    </div>
                    <div style={{marginTop:4,display:'inline-flex',alignItems:'center',padding:'2px 8px',borderRadius:10,background:'rgba(255,255,255,.65)',boxShadow:'0 .5px 1.5px rgba(0,0,0,.12)',border:'.5px solid rgba(0,0,0,.08)'}}>
                      <span style={{fontSize:11,fontWeight:500,color:'rgba(0,0,0,.45)'}}>Double-tap to edit</span>
                    </div>
                  </div>
                ):(
                  <textarea autoFocus value={editedDraft} onChange={e=>setEditedDraft(e.target.value)}
                    style={{width:'100%',border:'none',background:'transparent',outline:'none',fontSize:15,fontFamily:'inherit',color:'var(--primary-text)',resize:'none',lineHeight:1.4}} rows={3}/>
                )}
              </div>
              <div style={{width:36,height:36,borderRadius:18,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0,marginBottom:2}}
                onClick={()=>{
                  // Start simulation
                  const tx=TRANSCRIPTS[openThread.id];
                  if(tx){
                    setSimState('loading');
                    setSimLines([]);
                    setSimIdx(0);
                    // If text mode for healthcare, prepend text + callback flow
                    const isTextMode=threadSendAs==='text';
                    const isHealthcare=[1,2,4,5,7,8,9,10].includes(openThread.id);
                    if(isTextMode&&isHealthcare){
                      const textDraft=openThread.textDraft;
                      tx._simLines=[{w:'t',t:textDraft},{w:'s',t:'✓ Text delivered'},{w:'s',t:'📞 '+openThread.contact+' is calling back...'},{w:'s',t:'AI answering inbound call'},...tx.lines];
                    }else{
                      tx._simLines=tx.lines;
                    }
                    setTimeout(()=>{setSimState('playing')},isTextMode?1500:2000);
                  }else{
                    setSentIds(p=>[...p,openThread.id]);setOpenThread(null);
                  }
                }}>
                {I.arrowUp({s:16,c:'#fff'})}
              </div>
            </div>
            );
          })()}
        </div>

        {/* iOS Keyboard — FIXED, does not scroll */}
        <div style={{background:'#D1D3D9',padding:'6px 3px 2px',flexShrink:0}}>
          {[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['⇧','Z','X','C','V','B','N','M','⌫']].map((row,ri)=>(
            <div key={ri} style={{display:'flex',justifyContent:'center',gap:ri===2?4:5,marginBottom:5}}>
              {row.map((k,ki)=>{
                const isSpecial=k==='⇧'||k==='⌫';
                return <div key={ki} style={{width:isSpecial?38:30,height:36,background:'#fff',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:isSpecial?16:15,fontWeight:400,color:'#000',boxShadow:'0 1px 0 rgba(0,0,0,.3)',fontFamily:'-apple-system,sans-serif'}}>{k}</div>;
              })}
            </div>
          ))}
          <div style={{display:'flex',gap:5,justifyContent:'center'}}>
            <div style={{width:75,height:36,background:'#ADB3BC',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'#000',boxShadow:'0 1px 0 rgba(0,0,0,.25)'}}>123</div>
            <div style={{width:30,height:36,background:'#ADB3BC',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,color:'#000'}}>🌐</div>
            <div style={{flex:1,height:36,background:'#fff',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'#888',boxShadow:'0 1px 0 rgba(0,0,0,.3)'}}>space</div>
            <div style={{width:75,height:36,background:'#ADB3BC',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'#000',boxShadow:'0 1px 0 rgba(0,0,0,.25)'}}>return</div>
          </div>
          <div style={{height:4}}/>
        </div>
      </div>
    );
  }

  // ── Inbox list view ──
  return(
    <div className="phone">
      <StatusBar/>
      <div className="screen-content">
        {/* Search bar — right at top, no title */}
        <div style={{padding:'8px 0 8px'}}>
          <div className="search-bar">
            <span className="search-icon" style={{color:'var(--tertiary-text)',display:'flex'}}>{I.search({s:16,c:'var(--tertiary-text)'})}</span>
            <input placeholder="Search in 'To-Do'..."/>
          </div>
        </div>
        {/* Filter pills — horizontal scroll, single row */}
        <div style={{display:'flex',gap:8,padding:'4px 16px 12px',overflowX:'auto',overflowY:'hidden',flexWrap:'nowrap',WebkitOverflowScrolling:'touch',scrollbarWidth:'none',msOverflowStyle:'none'}} className="pill-scroll">
          {[{k:'inbox',l:'Inbox',badge:12},{k:'todo',l:'To-Do',badge:pending.length},{k:'unread',l:'Unread',badge:3},{k:'missed',l:'Missed',badge:1},{k:'urgent',l:'Urgent',badge:4}].map(f=>(
            <button key={f.k} className={`pill ${filter===f.k?'active':'inactive'}`} onClick={()=>setFilter(f.k)} style={{position:'relative',whiteSpace:'nowrap',flexShrink:0}}>
              {f.l}
              {f.badge?<span style={{position:'absolute',top:-6,right:-4,fontSize:10,fontWeight:700,minWidth:16,height:16,lineHeight:'16px',textAlign:'center',background:'var(--accent)',color:'#fff',borderRadius:8,padding:'0 4px'}}>{f.badge}</span>:null}
            </button>
          ))}
        </div>

        {filter==='todo'&&(
          <div>
            {TODOS.filter(t=>!sentIds.includes(t.id)).map(todo=>{
              const isUrgent=todo.due==='Today';
              return(
              <div className="contact-cell" key={todo.id} onClick={()=>{setOpenThread(todo);setThreadSendAs(todo.sendAs);setDraftEditing(false);setEditedDraft('')}}>
                <div className="contact-cell-icon" style={{background:'var(--surface-darken)'}}>
                  {I.outbound({s:20,c:'var(--primary-text)'})}
                </div>
                <div className="contact-cell-body">
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span className="contact-cell-name unread">{todo.displayContact||todo.contact}</span>
                    {isUrgent&&<span style={{display:'flex',color:'var(--error)'}}>{I.bell({s:14,c:'var(--error)'})}</span>}
                    <span className="todo-badge">To-Do</span>
                    <span style={{flex:1}}/>
                    <span className="contact-cell-date unread">{todo.due}</span>
                  </div>
                  <div className="contact-cell-preview unread" style={{marginTop:1}}>
                    {todo.summary}
                  </div>
                </div>
              </div>
              );
            })}
            {/* Sent items show as read */}
            {TODOS.filter(t=>sentIds.includes(t.id)).map(todo=>(
              <div className="contact-cell" key={todo.id}>
                <div className="contact-cell-icon" style={{background:'var(--surface-darken)'}}>
                  {I.outbound({s:20,c:'var(--tertiary-text)'})}
                </div>
                <div className="contact-cell-body">
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span className="contact-cell-name read" style={{textDecoration:'line-through',color:'var(--tertiary-text)'}}>{todo.displayContact||todo.contact}</span>
                    <span style={{flex:1}}/>
                    <span className="contact-cell-date read">Sent</span>
                  </div>
                  <div className="contact-cell-preview read">Sent just now</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* No bottom sheet — tapping a cell pushes a full-page thread view above */}
      <FloatingTabBar active="inbox" onTabTap={id=>{if(id==='profile'&&onNavigate)onNavigate('scenarios')}}/>
    </div>
  );
}

  const urlMap={inbox:'app.yousquared.ai/inbox',team:'app.yousquared.ai/team',invite:'app.yousquared.ai/team/invite',plan:'app.yousquared.ai/plan',referrals:'app.yousquared.ai/referrals',onboarding:'app.yousquared.ai/onboarding',about:'app.yousquared.ai/about-you',company:'app.yousquared.ai/company-info',secretary:'app.yousquared.ai/secretary-settings'};

  if(webPage==='onboarding'){
    return(
      <div className="web-frame">
        <div className="web-titlebar">
          <div className="web-dot" style={{background:'#ff5f57'}}/><div className="web-dot" style={{background:'#febc2e'}}/><div className="web-dot" style={{background:'#28c840'}}/>
          <div className="web-urlbar">app.yousquared.ai/onboarding</div>
        </div>
        <WebOnboardingPage/>
      </div>
    );
  }

  return(
    <WebFrame activeNav={webPage} onNav={setWebPage} url={urlMap[webPage]||'app.yousquared.ai'}>
      {webPage==='team'&&<WebTeamPage/>}
      {webPage==='invite'&&<WebInvitePage/>}
      {webPage==='referrals'&&<WebReferralsPage onNav={setWebPage}/>}
      {webPage==='inbox'&&<WebInboxPage onNav={setWebPage}/>}
      {(webPage==='about'||webPage==='company'||webPage==='secretary'||webPage==='plan')&&(
        <div className="web-page">
          <div className="web-page-title">{webPage==='about'?'About You':webPage==='company'?'Company Info':webPage==='secretary'?'Secretary Settings':'My Plan'}</div>
          <div className="web-page-sub">This page already exists in the web app</div>
          <div className="web-card" style={{display:'flex',alignItems:'center',justifyContent:'center',height:200,color:'#a1a1aa',fontSize:14}}>Existing page - not part of Team Viral Self-Serve prototype</div>
        </div>
      )}
    </WebFrame>
  );
}

// ══════════════════════════════════════════════════════════

// ── App ──
function App(){
  return <WebApp/>;
}

// ── Floating Feedback Chatbox ──
function FeedbackChat(){
  const[open,setOpen]=useState(true);
  const[msgs,setMsgs]=useState([{from:'bot',text:'Hey! What do you think of this prototype? Any feedback is welcome.'}]);
  const[input,setInput]=useState('');
  const[sending,setSending]=useState(false);
  const msgsEnd=useRef(null);
  const scrollToBottom=()=>{msgsEnd.current?.scrollIntoView({behavior:'smooth'})};

  const send=async()=>{
    if(!input.trim())return;
    const text=input.trim();
    setMsgs(m=>[...m,{from:'user',text}]);
    setInput('');
    setSending(true);
    try{
      await fetch('https://script.google.com/macros/s/APPS_SCRIPT_ID/exec',{
        method:'POST',mode:'no-cors',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text,screen:location.href,timestamp:new Date().toISOString()})
      });
    }catch(e){}
    setSending(false);
    setMsgs(m=>[...m,{from:'bot',text:'Thanks! Your feedback has been noted.'}]);
    setTimeout(scrollToBottom,100);
  };

  return(<>
    {/* Floating bubble */}
    {!open&&(
      <div onClick={()=>{setOpen(true);setTimeout(scrollToBottom,200)}}
        style={{position:'fixed',bottom:24,right:24,width:52,height:52,borderRadius:26,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:'0 4px 16px rgba(0,0,0,.3)',zIndex:100}}>
        {I.messages({s:24,c:'#fff'})}
      </div>
    )}
    {/* Chat panel */}
    {open&&(
      <div style={{position:'fixed',bottom:24,right:24,width:320,maxHeight:440,borderRadius:20,background:'#fff',boxShadow:'0 8px 32px rgba(0,0,0,.25)',zIndex:100,display:'flex',flexDirection:'column',overflow:'hidden',fontFamily:'Inter,sans-serif'}}>
        {/* Header */}
        <div style={{padding:'14px 16px',background:'var(--accent)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:15,fontWeight:600}}>Feedback</span>
          <span onClick={()=>setOpen(false)} style={{cursor:'pointer',fontSize:20,lineHeight:1,opacity:.8}}>×</span>
        </div>
        {/* Messages */}
        <div style={{flex:1,overflow:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:8,maxHeight:280}}>
          {msgs.map((m,i)=>(
            <div key={i} style={{alignSelf:m.from==='user'?'flex-end':'flex-start',maxWidth:'85%',padding:'8px 12px',borderRadius:m.from==='user'?'16px 16px 4px 16px':'16px 16px 16px 4px',background:m.from==='user'?'var(--accent)':'var(--surface-darken)',color:m.from==='user'?'#fff':'var(--primary-text)',fontSize:14,lineHeight:1.4}}>
              {m.text}
            </div>
          ))}
          <div ref={msgsEnd}/>
        </div>
        {/* Input */}
        <div style={{padding:'10px 12px',borderTop:'1px solid var(--border)',display:'flex',gap:8}}>
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send()}}
            placeholder="Type your feedback..."
            style={{flex:1,padding:'8px 12px',borderRadius:20,border:'1px solid var(--border)',fontSize:14,fontFamily:'inherit',outline:'none'}}/>
          <div onClick={send}
            style={{width:34,height:34,borderRadius:17,background:input.trim()?'var(--accent)':'var(--border)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
            {I.arrowUp({s:14,c:'#fff'})}
          </div>
        </div>
      </div>
    )}
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
